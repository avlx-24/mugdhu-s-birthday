<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You 💌</title>
    <link rel="stylesheet" href="style.css">
    <!-- Typed.js library for typewriter effect -->
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
</head>
<body>

    <main class="page-wrapper">
        <h1 class="title-hero">A Note For You</h1>
        <p class="title-sub">Read this slowly—every word comes straight from the heart.</p>

        <div class="glass-card letter-wrapper">
            <div class="letter-header">
                <span class="letter-stamp">Birthday Edition</span>
                <span aria-hidden="true">💌 ✨</span>
            </div>

            <!-- Typed text container -->
            <div class="letter-body">
                <span id="typed-text"></span>
            </div>
        </div>

        <nav class="btn-group" aria-label="Page Navigation">
            <a href="index.html" class="btn btn-secondary">
                <span class="icon-arrow-left" aria-hidden="true">&larr;</span> Back
            </a>
            <a href="gallery.html" class="btn btn-primary">
                View Memories <span class="icon-arrow" aria-hidden="true">&rarr;</span>
            </a>
        </nav>
    </main>

    <script src="script.js"></script>
</body>
</html>
